; Production overrides on top of php.ini-production.
; memory_limit stays at the 128M default: 4 FrankenPHP threads must fit the 320M container cap.
expose_php = Off
upload_max_filesize = 10M
post_max_size = 12M
opcache.enable = 1
; Code is immutable inside the image, so skip per-request file stat checks.
opcache.validate_timestamps = 0
