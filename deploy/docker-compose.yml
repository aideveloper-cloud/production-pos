# Production stack on k-garden-server (/opt/production-pos).
# Shared droplet: every service has a hard memory cap and no public ports.
# Traffic arrives only through the Cloudflare Tunnel "production-pos".
name: production-pos

x-app: &app
  image: production-pos-app:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - app-storage:/app/storage
  depends_on:
    mysql:
      condition: service_healthy
  networks: [pos]

services:
  app:
    <<: *app
    environment:
      POS_ROLE: web
    mem_limit: 320m

  scheduler:
    <<: *app
    environment:
      POS_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    mem_limit: 128m

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=40
      - --key-buffer-size=8M
      - --table-open-cache=200
      - --thread-cache-size=4
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 320m
    networks: [pos]

  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    environment:
      SPOOLMAN_PORT: 7912
    volumes:
      - spoolman-data:/home/app/.local/share/spoolman
    mem_limit: 192m
    networks: [pos]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}", "--url", "http://app:80"]
    mem_limit: 128m
    depends_on: [app]
    networks: [pos]

volumes:
  app-storage:
  mysql-data:
  spoolman-data:

networks:
  pos:
